---
# Create Kubernetes namespace
# -----------------------------------------------------------------------------
- name: Create namespace for SFTP Client
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ sftp_client_namespace }}"
        labels:
          name: sftp-client

- name: Display namespace information
  ansible.builtin.debug:
    msg: "Namespace '{{ sftp_client_namespace }}' is ready"

